<path d="M263 357V455" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="200" y="391" width="126" height="29" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="263" y="411" class="relation" text-anchor="middle">1 → 0..N</text>
<path d="M888 357V455" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="825" y="391" width="126" height="29" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="888" y="411" class="relation" text-anchor="middle">1 → 0..N</text>
<path d="M480 624H663" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><text x="575" y="599" class="relation" text-anchor="middle">booking_id</text><text x="575" y="650" class="relation" text-anchor="middle">0..1 → 0..N</text>
