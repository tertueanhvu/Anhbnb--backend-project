<g><rect x="775" y="854" width="330" height="222" rx="13" fill="white" stroke="#78609e" stroke-width="1.6"/><path d="M788 854H1092Q1105 854 1105 867V902H775V867Q775 854 788 854Z" fill="#78609e"/><text x="795" y="885" class="table" text-anchor="start">payments</text><text x="792" y="932" class="key" text-anchor="start">PK</text><text x="867" y="932" class="field" text-anchor="start">id</text><text x="792" y="960" class="key" text-anchor="start">FK</text><text x="867" y="960" class="field" text-anchor="start">booking_id</text><text x="792" y="988" class="key" text-anchor="start"></text><text x="867" y="988" class="field" text-anchor="start">attempt_number</text><text x="792" y="1016" class="key" text-anchor="start"></text><text x="867" y="1016" class="field" text-anchor="start">status / amount</text><text x="794" y="1058" class="note" text-anchor="start">FK parent: bookings</text></g>
<text x="45" y="1115" class="note" text-anchor="start">PK = primary key · FK = foreign key · repeated PK labels form a composite key.</text>
<text x="45" y="1143" class="note" text-anchor="start">Selected fields shown. users and properties are referenced parents; event/projection tables are described in the README.</text>
</svg>
