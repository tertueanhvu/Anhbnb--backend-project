<text x="45" y="828" class="section" text-anchor="start">ALLOCATION SNAPSHOTS + PAYMENT ATTEMPTS</text>
<g><rect x="45" y="854" width="330" height="222" rx="13" fill="white" stroke="#4b798b" stroke-width="1.6"/><path d="M58 854H362Q375 854 375 867V902H45V867Q45 854 58 854Z" fill="#4b798b"/><text x="65" y="885" class="table" text-anchor="start">booking_rooms</text><text x="62" y="932" class="key" text-anchor="start">PK FK</text><text x="137" y="932" class="field" text-anchor="start">booking_id</text><text x="62" y="960" class="key" text-anchor="start">PK FK</text><text x="137" y="960" class="field" text-anchor="start">room_id</text><text x="64" y="1036" class="note" text-anchor="start">FK parents: bookings + rooms</text><text x="64" y="1058" class="note" text-anchor="start">Which physical rooms were assigned?</text></g>
