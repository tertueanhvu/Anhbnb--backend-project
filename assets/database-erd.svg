<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1170" viewBox="0 0 1150 1170" role="img" aria-labelledby="title desc">
<title id="title">Availability and booking database ERD</title><desc id="desc">Four core tables show actual foreign keys between room types, rooms, nightly availability and bookings. Three supporting tables show allocation, nightly price snapshots and payment attempts. Key labels are separate from field names.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203047}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#5a6c80}.table{font-size:20px;font-weight:700;fill:white}.field{font-family:Menlo,Consolas,monospace;font-size:16px}.key{font-size:12px;font-weight:700;fill:#64748b}.note{font-size:14px;fill:#52647a}.relation{font-size:13px;font-weight:700}.section{font-size:15px;font-weight:700;letter-spacing:.8px}.body{font-size:16px}</style></defs>
<rect width="1150" height="1170" fill="white"/>
<text x="45" y="48" class="title" text-anchor="start">AVAILABILITY + BOOKING  /  DATABASE ERD</text>
<text x="47" y="78" class="sub" text-anchor="start">One booking → one room type → multiple physical rooms → one inventory row per night</text>
<rect x="24" y="110" width="1102" height="674" rx="22" fill="#f4f7fb" stroke="#c6d4e3" stroke-dasharray="7 5"/>
<g><rect x="45" y="143" width="435" height="214" rx="13" fill="white" stroke="#3676a1" stroke-width="1.6"/><path d="M58 143H467Q480 143 480 156V191H45V156Q45 143 58 143Z" fill="#3676a1"/><text x="65" y="174" class="table" text-anchor="start">room_types</text><text x="62" y="221" class="key" text-anchor="start">PK</text><text x="137" y="221" class="field" text-anchor="start">id</text><text x="62" y="249" class="key" text-anchor="start">FK</text><text x="137" y="249" class="field" text-anchor="start">property_id</text><text x="62" y="277" class="key" text-anchor="start"></text><text x="137" y="277" class="field" text-anchor="start">max_guests</text><text x="62" y="305" class="key" text-anchor="start"></text><text x="137" y="305" class="field" text-anchor="start">base_price / currency</text><text x="64" y="339" class="note" text-anchor="start">UNIQUE (id, property_id)</text></g>
<g><rect x="670" y="143" width="435" height="214" rx="13" fill="white" stroke="#3676a1" stroke-width="1.6"/><path d="M683 143H1092Q1105 143 1105 156V191H670V156Q670 143 683 143Z" fill="#3676a1"/><text x="690" y="174" class="table" text-anchor="start">rooms</text><text x="687" y="221" class="key" text-anchor="start">PK</text><text x="762" y="221" class="field" text-anchor="start">id</text><text x="687" y="249" class="key" text-anchor="start">FK *</text><text x="762" y="249" class="field" text-anchor="start">room_type_id</text><text x="687" y="277" class="key" text-anchor="start">FK *</text><text x="762" y="277" class="field" text-anchor="start">property_id</text><text x="687" y="305" class="key" text-anchor="start"></text><text x="762" y="305" class="field" text-anchor="start">room_code</text><text x="689" y="339" class="note" text-anchor="start">* Composite FK → room_types (id, property_id)</text></g>
<g><rect x="45" y="462" width="435" height="300" rx="13" fill="white" stroke="#b26a2b" stroke-width="1.6"/><path d="M58 462H467Q480 462 480 475V510H45V475Q45 462 58 462Z" fill="#b26a2b"/><text x="65" y="493" class="table" text-anchor="start">bookings</text><text x="62" y="540" class="key" text-anchor="start">PK</text><text x="137" y="540" class="field" text-anchor="start">id</text><text x="62" y="568" class="key" text-anchor="start">FK</text><text x="137" y="568" class="field" text-anchor="start">user_id</text><text x="62" y="596" class="key" text-anchor="start">FK</text><text x="137" y="596" class="field" text-anchor="start">room_type_id</text><text x="62" y="624" class="key" text-anchor="start"></text><text x="137" y="624" class="field" text-anchor="start">check_in / check_out</text><text x="62" y="652" class="key" text-anchor="start"></text><text x="137" y="652" class="field" text-anchor="start">room_quantity</text><text x="62" y="680" class="key" text-anchor="start"></text><text x="137" y="680" class="field" text-anchor="start">status / hold_expires_at</text><text x="62" y="708" class="key" text-anchor="start"></text><text x="137" y="708" class="field" text-anchor="start">total_amount / currency</text><text x="64" y="744" class="note" text-anchor="start">UNIQUE (user_id, idempotency_key)</text></g>
<g><rect x="670" y="462" width="435" height="300" rx="13" fill="white" stroke="#23856a" stroke-width="1.6"/><path d="M683 462H1092Q1105 462 1105 475V510H670V475Q670 462 683 462Z" fill="#23856a"/><text x="690" y="493" class="table" text-anchor="start">room_availability</text><text x="687" y="540" class="key" text-anchor="start">PK FK</text><text x="762" y="540" class="field" text-anchor="start">room_id</text><text x="687" y="568" class="key" text-anchor="start">PK</text><text x="762" y="568" class="field" text-anchor="start">stay_date</text><text x="687" y="596" class="key" text-anchor="start"></text><text x="762" y="596" class="field" text-anchor="start">price</text><text x="687" y="624" class="key" text-anchor="start"></text><text x="762" y="624" class="field" text-anchor="start">status</text><text x="687" y="652" class="key" text-anchor="start">FK ?</text><text x="762" y="652" class="field" text-anchor="start">booking_id</text><text x="689" y="700" class="note" text-anchor="start">PK (room_id, stay_date)</text><text x="689" y="722" class="note" text-anchor="start">OPEN · HELD · BOOKED · CLOSED</text><text x="689" y="744" class="note" text-anchor="start">? booking_id is nullable; see status rule below</text></g>
